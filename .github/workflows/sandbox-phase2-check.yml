name: Check Revolut Sandbox from Droplet

"on":
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * *"

concurrency:
  group: revolut-sandbox-phase2-check
  cancel-in-progress: false

permissions:
  contents: read
  issues: write

jobs:
  check:
    name: READ-only Sandbox account check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: sandbox-phase2

    steps:
      - name: Configure SSH
        env:
          DEPLOY_KEY: ${{ secrets.DROPLET_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DROPLET_KNOWN_HOSTS }}
        run: |
          install -d -m 0700 "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_KEY" > "$HOME/.ssh/deploy_key"
          printf '%s\n' "$KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 0600 "$HOME/.ssh/deploy_key" "$HOME/.ssh/known_hosts"

      - name: Run daily remote monitor on Droplet
        env:
          DROPLET_HOST: ${{ secrets.DROPLET_HOST }}
          DROPLET_USER: ${{ secrets.DROPLET_USER }}
        run: |
          ssh -i "$HOME/.ssh/deploy_key" \
            "${DROPLET_USER}@${DROPLET_HOST}" \
            "bash /opt/revolut/current/scripts/deploy/run-remote-monitor-check.sh"

      - name: Open or update scheduled failure alert
        if: ${{ failure() && github.event_name == 'schedule' }}
        env:
          GH_TOKEN: ${{ github.token }}
          ALERT_TITLE: "[Ops] Daily Revolut Sandbox monitor failed"
        run: |
          issue_number="$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --limit 100 \
            --json number,title \
            --jq '.[] | select(.title == env.ALERT_TITLE) | .number' | head -n 1)"
          run_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          if [[ -n "$issue_number" ]]; then
            gh issue comment "$issue_number" --repo "$GITHUB_REPOSITORY" \
              --body "The scheduled monitor failed again: ${run_url}"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" \
              --title "$ALERT_TITLE" \
              --body "The scheduled read-only Sandbox monitor failed. Review the run before performing any transfer operation: ${run_url}"
          fi

      - name: Close recovered scheduled failure alert
        if: ${{ success() && github.event_name == 'schedule' }}
        env:
          GH_TOKEN: ${{ github.token }}
          ALERT_TITLE: "[Ops] Daily Revolut Sandbox monitor failed"
        run: |
          issue_number="$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --limit 100 \
            --json number,title \
            --jq '.[] | select(.title == env.ALERT_TITLE) | .number' | head -n 1)"
          if [[ -n "$issue_number" ]]; then
            run_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            gh issue comment "$issue_number" --repo "$GITHUB_REPOSITORY" \
              --body "The scheduled monitor recovered successfully: ${run_url}"
            gh issue close "$issue_number" --repo "$GITHUB_REPOSITORY" \
              --reason completed
          fi
