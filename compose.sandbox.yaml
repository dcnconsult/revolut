services:
  api:
    environment:
      REVOLUT_MODE: sandbox
      REVOLUT_SANDBOX_CONFIG_PATH: /run/secrets/revolut-sandbox-config
      REVOLUT_SANDBOX_TOKENS_PATH: /run/secrets/revolut-sandbox-tokens
      REVOLUT_SANDBOX_PRIVATE_KEY_PATH: /run/secrets/revolut-sandbox-private-key
      OPERATOR_AUTH_CONFIG_PATH: /run/secrets/operator-auth-config
      SANDBOX_DATABASE_PATH: /var/lib/revolut/sandbox-transfers.sqlite
      SANDBOX_BACKUP_STATUS_PATH: /var/backups/revolut
    volumes:
      - ${REVOLUT_SANDBOX_CONFIG_FILE:-/etc/revolut/sandbox/config.json}:/run/secrets/revolut-sandbox-config:ro
      - ${REVOLUT_SANDBOX_TOKENS_FILE:-/etc/revolut/sandbox/tokens.json}:/run/secrets/revolut-sandbox-tokens:ro
      - ${REVOLUT_SANDBOX_PRIVATE_KEY_FILE:-/etc/revolut/sandbox/privatecert.pem}:/run/secrets/revolut-sandbox-private-key:ro
      - ${OPERATOR_AUTH_CONFIG_FILE:-/etc/revolut/sandbox/operator-auth.json}:/run/secrets/operator-auth-config:ro
      - revolut-data:/var/lib/revolut
      - /var/backups/revolut:/var/backups/revolut:ro
    depends_on:
      clamav:
        condition: service_healthy

  clamav:
    image: clamav/clamav:1.4
    restart: unless-stopped
    expose:
      - "3310"
    volumes:
      - clamav-definitions:/var/lib/clamav
    healthcheck:
      test: ["CMD", "/usr/local/bin/clamdcheck.sh"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 120s
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
      - /run/clamav:size=16m,mode=0755

volumes:
  revolut-data:
  clamav-definitions:
